<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Study More — Grey Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <style>
    :root{
      --bg:#1e1f22;
      --panel:#2a2b2f;
      --muted:#9ca3af;
      --text:#e5e7eb;
      --accent:#3b82f6;
      --accent-2:#06b6d4;
      --card-shadow: 0 8px 30px rgba(0,0,0,0.25);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: linear-gradient(180deg, #1a1b1d, #26282c);
      color:var(--text);
      padding:36px 20px;
    }

    .page{
      max-width:1200px;
      margin:0 auto;
      background: var(--panel);
      border-radius:24px;
      padding:28px;
      box-shadow: var(--card-shadow);
      border:1px solid rgba(255,255,255,0.06);
    }

    .header{
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
      padding:12px 8px 20px 8px;
    }

    .home-btn{
      display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.05); padding:10px 14px; border-radius:10px;
      text-decoration:none; color:var(--text); font-weight:600; font-size:0.95rem; transition:background .25s;
    }
    .home-btn:hover{ background:rgba(255,255,255,0.12); }

    .brand{ display:flex; align-items:center; gap:14px; }
    .logo{
      width:60px; height:60px; border-radius:14px; background:linear-gradient(135deg,var(--accent),var(--accent-2));
      display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-family:'Space Grotesk',sans-serif; box-shadow:0 6px 18px rgba(0,0,0,0.4);
    }
    .title-block h1{ margin:0; font-size:1.6rem; letter-spacing:0.6px; }
    .title-block p{ margin:4px 0 0 0; color:var(--muted); font-size:0.95rem }

    .controls{ display:flex; gap:12px; align-items:center; }
    .search{ display:flex; align-items:center; gap:10px; background:#1f2125; padding:8px 12px; border-radius:999px; border:1px solid rgba(255,255,255,0.08); }
    .search input{ border:0; outline:0; background:transparent; color:var(--text); font-size:0.95rem; width:220px }
    .chip{ padding:8px 12px; border-radius:12px; background:#2e2f33; color:var(--muted); font-weight:600; cursor:pointer; border:1px solid rgba(255,255,255,0.08)}
    .chip.active{ background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:white; box-shadow:0 8px 20px rgba(59,130,246,0.22) }

    .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:18px }

    .card{
      background:#242528;
      border-radius:16px; padding:18px; display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
      border:1px solid rgba(255,255,255,0.05);
      transition: transform .28s cubic-bezier(.2,.9,.3,1), box-shadow .2s;
      box-shadow: var(--card-shadow);
    }
    .card:hover{ transform: translateY(-8px); box-shadow: 0 18px 40px rgba(0,0,0,0.4) }

    .thumb{ width:72px; height:72px; border-radius:12px; display:grid; place-items:center; font-size:1.4rem; color:white; font-weight:700; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex-shrink:0; }
    .meta{ display:flex; flex-direction:column }
    .meta .name{ font-weight:700; letter-spacing:0.2px }
    .meta .desc{ margin-top:6px; color:var(--muted); font-size:0.92rem }
    .badge{ margin-left:auto; display:inline-flex; align-items:center; gap:8px; background:#2f3033; padding:8px 12px; border-radius:999px; font-weight:700; color:var(--muted); font-size:0.86rem; }

    @media (max-width:980px){ .grid{ grid-template-columns:repeat(2,1fr) } }
    @media (max-width:580px){ .grid{ grid-template-columns:1fr } }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <a href="#" class="home-btn"><i class="fa-solid fa-house"></i> Home</a>
      <div class="brand">
        <div class="logo">SM</div>
        <div class="title-block">
          <h1>Study More — Grey Edition</h1>
          <p>Organized playlists & quick revision capsules.</p>
        </div>
      </div>
      <div class="controls">
        <div class="search"><i class="fa-solid fa-magnifying-glass" style="opacity:.6"></i><input id="searchInput" placeholder="Search..." /></div>
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="video">Videos</button>
      </div>
    </div>

    <div id="grid" class="grid">
      <!-- Cards reused -->
    </div>
  </div>
</body>
</html>
