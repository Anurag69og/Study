<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study More As You Can</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <style>
    :root{
      --bg-1:#0b0d10;
      --bg-2:#111318;
      --card-1:#1a1f27;
      --card-2:#191d22;
      --text:#e7eef7;
      --muted:#a6c3de;
      --accent:#4cc9ff;
      --accent-2:#0ea5e9;
      --shadow:0 10px 40px rgba(0,0,0,.35);
      --glow:0 0 0 transparent;
    }

    /* Global dark theme */
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text);
      /* MODIFIED: Removed radial-gradients for a static background */
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      background-attachment: fixed;
      overflow-y: overlay; /* nicer scrollbars on supported browsers */
    }

    /* Subtle glassy container */
    .container{
      max-width: 1200px;
      margin: 48px auto; /* MODIFIED: Removed top margin, title handles spacing */
      padding: 32px;
      background: color-mix(in oklab, var(--bg-2), #0d1015 30%);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      box-shadow: var(--shadow);
      /* REMOVED: backdrop-filter: blur(4px); */
    }

    /* MODIFIED: Simplified title block */
    .title-box{
      text-align: center;
      padding: 80px 0 30px 0; /* Creates space at the top */
      cursor: default;
      user-select: none;
    }
    .title-box .dot{
      display: none; /* REMOVED: Hide the dot */
    }
    .title-box h1{
      margin: 0;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text); /* Made it brighter */
      text-shadow: none; /* Removed glow */
      white-space: nowrap;
    }
    /* REMOVED: All .title-box:hover styles */
    /* REMOVED: @keyframes blinkGlow */
    /* REMOVED: body.scrolling .title-box */

    /* Grid of 18 oval-ish cards */
    .grid{
      display:flex; flex-wrap:wrap; gap:22px; justify-content:center;
    }
    .link-card{
      background: linear-gradient(130deg, var(--card-1), var(--card-2) 80%);
      flex: 1 0 28%;
      min-width: 250px; max-width: 31%;
      padding: 28px 20px;
      border-radius: 18px; /* MODIFIED: Simplified from oval corners */
      border: 1px solid rgba(255,255,255,.06);
      box-shadow: 0 6px 22px rgba(0,0,0,.35);
      display:flex; align-items:center; justify-content:center;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      opacity: 1; /* MODIFIED: Was 0 for animation */
      transition: transform .25s ease, box-shadow .24s ease; /* MODIFIED: Simplified transition */
      /* REMOVED: animation: cardPopIn ... */
    }
    
    /* REMOVED: Animation delay rules */
    /* REMOVED: .link-card::before (sheen effect) */

    .link-card:hover{
      /* MODIFIED: Simplified hover effect */
      transform: translateY(-6px);
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
      z-index:1;
    }
    /* REMOVED: .link-card:hover::before */

    .redirect-link{
      text-decoration:none; color: var(--muted);
      font-size: 1.12rem; font-weight: 650; letter-spacing:.4px;
      display:flex; align-items:center; gap:12px; position:relative;
    }
    .link-card:hover .redirect-link{ color:#fff }
    .card-icon{ font-size:1.25em; color:var(--accent); transition: color .2s; } /* MODIFIED: Removed transform transition */
    .link-card:hover .card-icon{
      /* MODIFIED: Removed transform (rotate/scale) */
      color:#fff;
      text-shadow: 0 2px 12px rgba(127,208,255,.5);
    }

    /* REMOVED: @keyframes cardPopIn */

    /* Responsive tweaks */
    @media (max-width: 900px){ .container{padding:18px 10px} .link-card{ min-width:46%; max-width:48%; padding:20px 12px } }
    @media (max-width: 600px){ .link-card{ min-width:98%; max-width:98% } .title-box{ padding: 40px 0 20px 0; } }

    /* Fancy dark scrollbars (supported browsers) */
    *{ scrollbar-width: thin; scrollbar-color: #2c3947 #0f141b }
    *::-webkit-scrollbar{ width:10px }
    *::-webkit-scrollbar-track{ background:#0f141b }
    *::-webkit-scrollbar-thumb{ background:#2c3947; border-radius:10px }
    *::-webkit-scrollbar-thumb:hover{ background:#36495c }
  </style>
</head>
<body>
  <div class="title-box" id="floatingTitle" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <h1>study more as you can</h1>
  </div>

  <div class="container">
    <div class="grid">
      <div class="link-card"><a class="redirect-link" href="https://www.coursera.org/" target="_blank"><span class="card-icon"><i class="fa-solid fa-graduation-cap"></i></span>Coursera</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.khanacademy.org/" target="_blank"><span class="card-icon"><i class="fa-solid fa-chalkboard-user"></i></span>Khan Academy</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.edx.org/" target="_blank"><span class="card-icon"><i class="fa-brands fa-researchgate"></i></span>edX</a></div>

      <div class="link-card"><a class="redirect-link" href="https://www.udemy.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-laptop-code"></i></span>Udemy</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.futurelearn.com/" target="_blank"><span class="card-icon"><i class="fa-regular fa-lightbulb"></i></span>FutureLearn</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.skillshare.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-paint-brush"></i></span>Skillshare</a></div>

      <div class="link-card"><a class="redirect-link" href="https://www.codecademy.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-code"></i></span>Codecademy</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.linkedin.com/learning/" target="_blank"><span class="card-icon"><i class="fa-brands fa-linkedin"></i></span>LinkedIn Learning</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.pluralsight.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-layer-group"></i></span>Pluralsight</a></div>

      <div class="link-card"><a class="redirect-link" href="https://www.academicearth.org/" target="_blank"><span class="card-icon"><i class="fa-solid fa-globe"></i></span>Academic Earth</a></div>
      <div class="link-card"><a class="redirect-link" href="https://ocw.mit.edu/" target="_blank"><span class="card-icon"><i class="fa-solid fa-microchip"></i></span>MIT OCW</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.open.edu/openlearn/" target="_blank"><span class="card-icon"><i class="fa-solid fa-book-open"></i></span>OpenLearn</a></div>

      <div class="link-card"><a class="redirect-link" href="https://www.saylor.org/" target="_blank"><span class="card-icon"><i class="fa-solid fa-award"></i></span>Saylor Academy</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.udacity.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-rocket"></i></span>Udacity</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.masterclass.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-clapperboard"></i></span>MasterClass</a></div>

      <div class="link-card"><a class="redirect-link" href="https://www.alison.com/" target="_blank"><span class="card-icon"><i class="fa-solid fa-certificate"></i></span>Alison</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.youtube.com/education" target="_blank"><span class="card-icon"><i class="fa-brands fa-youtube"></i></span>YouTube Education</a></div>
      <div class="link-card"><a class="redirect-link" href="https://www.wikipedia.org/" target="_blank"><span class="card-icon"><i class="fa-brands fa-wikipedia-w"></i></span>Wikipedia</a></div>
    </div>
  </div>

  </body>
</html>
