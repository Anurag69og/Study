<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Study As Much You Can</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: linear-gradient(120deg, #f8fafc 0%, #e0e7ff 100%);
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(35, 38, 49, 0.15);
    }
    h1 {
      text-align: center;
      color: #203354;
      font-size: 2.4rem;
      margin-bottom: 36px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
    }
    .link-card {
      background: linear-gradient(120deg, #e0e7ff 0%, #f1f5f9 100%);
      flex: 1 0 28%;
      min-width: 260px;
      max-width: 31%;
      margin-bottom: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(35, 38, 49, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 26px 18px;
      transition: transform 0.18s, box-shadow 0.18s;
    }
    .link-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 6px 20px rgba(70, 96, 155, 0.17);
      background: linear-gradient(120deg, #a5b4fc 0%, #e0e7ff 100%);
    }
    .redirect-link {
      text-decoration: none;
      color: #233869;
      font-size: 1.23rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .link-card:hover .redirect-link {
      color: #2563eb;
    }
    @media (max-width: 800px) {
      .grid {
        gap: 16px;
      }
      .link-card {
        min-width: 48%;
        max-width: 48%;
        padding: 20px 12px;
      }
    }
    @media (max-width: 500px) {
      .container {
        padding: 16px;
        margin: 0;
      }
      .link-card {
        min-width: 98%;
        max-width: 98%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Study As Much You Can</h1>
    <div class="grid">
      <!-- ROW 1 -->
      <div class="link-card">
        <a class="redirect-link" href="https://www.coursera.org/" target="_blank">Coursera</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.khanacademy.org/" target="_blank">Khan Academy</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.edx.org/" target="_blank">edX</a>
      </div>
      <!-- ROW 2 -->
      <div class="link-card">
        <a class="redirect-link" href="https://www.udemy.com/" target="_blank">Udemy</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.futurelearn.com/" target="_blank">FutureLearn</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.skillshare.com/" target="_blank">Skillshare</a>
      </div>
      <!-- ROW 3 -->
      <div class="link-card">
        <a class="redirect-link" href="https://www.codecademy.com/" target="_blank">Codecademy</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.linkedin.com/learning/" target="_blank">LinkedIn Learning</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.pluralsight.com/" target="_blank">Pluralsight</a>
      </div>
      <!-- ROW 4 -->
      <div class="link-card">
        <a class="redirect-link" href="https://www.academicearth.org/" target="_blank">Academic Earth</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://ocw.mit.edu/" target="_blank">MIT OpenCourseWare</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.open.edu/openlearn/" target="_blank">OpenLearn</a>
      </div>
      <!-- ROW 5 -->
      <div class="link-card">
        <a class="redirect-link" href="https://www.saylor.org/" target="_blank">Saylor Academy</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.udacity.com/" target="_blank">Udacity</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.masterclass.com/" target="_blank">MasterClass</a>
      </div>
      <!-- ROW 6 -->
      <div class="link-card">
        <a class="redirect-link" href="https://www.alison.com/" target="_blank">Alison</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.youtube.com/education" target="_blank">YouTube Education</a>
      </div>
      <div class="link-card">
        <a class="redirect-link" href="https://www.wikipedia.org/" target="_blank">Wikipedia</a>
      </div>
    </div>
  </div>
</body>
</html>
