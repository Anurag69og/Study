<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Songs — Grey Harmony (100)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <style>
    :root{
      --bg:#1b1b1d;
      --panel:#222325;
      --muted:#a0a3a8;
      --text:#f2f2f3;
      --card:#2a2b2d;
      --shadow:0 8px 24px rgba(0,0,0,0.4);
      --yt-red:#FF0000;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .page{
      max-width:1100px;
      margin:auto;
      background: var(--panel);
      border-radius:16px;
      padding:20px;
      box-shadow: var(--shadow);
      border:1px solid rgba(255,255,255,0.05);
    }

    /* Restored YouTube logo (red) */
    .yt-logo-wrap{display:flex;justify-content:center;align-items:center;margin-bottom:12px;}
    .yt-logo{display:flex;align-items:center;gap:10px;background:#202123;padding:10px 16px;border-radius:10px;box-shadow:0 4px 10px rgba(255,0,0,0.3);}
    .yt-logo i{color:var(--yt-red);font-size:1.5rem;}
    .yt-logo span{font-weight:700;color:var(--text);}

    .header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-bottom:10px;}
    .home-btn{display:inline-flex;align-items:center;gap:8px;background:#2c2d2f;padding:8px 14px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;}
    .title-area{display:flex;align-items:center;gap:12px;}
    .logo{width:46px;height:46px;border-radius:8px;background:#2f3032;display:grid;place-items:center;font-weight:800;}
    .title-area h1{margin:0;font-size:1.15rem;}
    .title-area p{margin-top:4px;color:var(--muted);font-size:0.85rem;}

    .controls{display:flex;gap:8px;align-items:center;}
    .search{display:flex;align-items:center;gap:8px;background:#262729;padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,0.06);}
    .search input{border:0;outline:0;background:transparent;color:var(--text);font-size:0.95rem;width:200px;}
    .chip{padding:8px 12px;border-radius:12px;background:#2f3032;color:var(--muted);font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.04);}
    .chip.active{background:#3a3b3e;color:white;box-shadow:0 6px 18px rgba(0,0,0,0.45);}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px;}
    .card{
      background:var(--card);
      border-radius:12px;
      padding:14px;
      display:flex;align-items:center;gap:14px;
      text-decoration:none;color:inherit;
      border:1px solid rgba(255,255,255,0.03);
      transition:all .25s ease;
    }
    .card:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(255,255,255,0.08);}

    .thumb{
      width:60px;height:60px;border-radius:10px;display:grid;place-items:center;
      background:#2e2f31;
      box-shadow:inset 0 0 8px rgba(255,255,255,0.08);
    }
    /* B&W logo for song cards */
    .thumb i{
      color:#fff;font-size:1.4rem;filter:grayscale(100%) brightness(150%);
    }

    .meta{display:flex;flex-direction:column;}
    .meta .name{font-weight:700;font-size:0.95rem;}
    .badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;background:#313234;padding:6px 10px;border-radius:999px;font-weight:700;color:var(--muted);font-size:0.82rem;}

    .footer-note{margin-top:12px;color:var(--muted);font-size:0.88rem;text-align:center;}

    @media(max-width:820px){.grid{grid-template-columns:1fr}.search input{width:140px}}
  </style>
</head>
<body>
  <div class="page">
    <div class="yt-logo-wrap">
      <div class="yt-logo"><i class="fa-brands fa-youtube"></i><span>YouTube</span></div>
    </div>

    <div class="header">
      <a href="#" class="home-btn" title="Home"><i class="fa-solid fa-house">index.html</i> Home</a>

      <div class="title-area">
        <div class="logo">YT</div>
        <div>
          <h1>YouTube Songs — Grey Harmony (100)</h1>
          <p>Hindi trending, lofi & reverb — uniform grey background, B&W song logos</p>
        </div>
      </div>

      <div class="controls">
        <div class="search"><i class="fa-solid fa-magnifying-glass" style="opacity:.6"></i><input id="searchInput" placeholder="Search (e.g. hindi, lofi)..." /></div>
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="hindi">Hindi</button>
        <button class="chip" data-filter="lofi">Lofi</button>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
    <div class="footer-note">Tip: press <kbd>/</kbd> to focus search. Click a card to open YouTube.</div>
  </div>

  <script>
    const provided = [
      { title: 'Provided 1', url: 'https://www.youtube.com/watch?v=zCUtF6Ts0is', tag: 'Hindi' },
      { title: 'Provided 2', url: 'https://www.youtube.com/watch?v=b5Wu9ypTKqM', tag: 'Hindi' },
      { title: 'Provided 3', url: 'https://www.youtube.com/watch?v=s_WCm5PMzmk', tag: 'Lofi' },
      { title: 'Provided 4', url: 'https://www.youtube.com/watch?v=55c6IlV7BEo', tag: 'Hindi' },
      { title: 'Provided 5', url: 'https://www.youtube.com/watch?v=eYSaHXXFIBU', tag: 'Reverb' },
      { title: 'Provided 6', url: 'https://www.youtube.com/watch?v=mt-5ZbKqiDc', tag: 'Lofi' }
    ];

    const songs = [...provided];

    function makeSearchLink(query){ return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query); }

    const hindiSeeds = ['arijit new', 'neha kakkar hit', 'bollywood song', 'indie hindi', 'romantic hindi', 'sad hindi', 'party hindi'];
    const lofiSeeds = ['lofi chill', 'study lofi', 'lofi rain', 'late night lofi', 'anime lofi'];
    const reverbSeeds = ['reverb mix', 'ambient reverb', 'dreamy reverb'];

    while(songs.length < 100){
      const type = (songs.length % 3 === 0) ? 'Lofi' : (songs.length % 3 === 1) ? 'Hindi' : 'Reverb';
      let seed;
      if(type === 'Hindi') seed = hindiSeeds[Math.floor(Math.random()*hindiSeeds.length)] + ' ' + (Math.floor(Math.random()*100)+1);
      if(type === 'Lofi') seed = lofiSeeds[Math.floor(Math.random()*lofiSeeds.length)] + ' ' + (Math.floor(Math.random()*80)+1);
      if(type === 'Reverb') seed = reverbSeeds[Math.floor(Math.random()*reverbSeeds.length)] + ' ' + (Math.floor(Math.random()*40)+1);
      songs.push({ title: `${type} • ${seed}`, url: makeSearchLink(seed), tag: type });
    }

    const grid = document.getElementById('grid');
    function createCard(s, i){
      const a = document.createElement('a'); a.className='card'; a.href=s.url; a.target='_blank'; a.rel='noopener noreferrer';
      const thumb = document.createElement('div'); thumb.className='thumb'; thumb.innerHTML='<i class="fa-solid fa-music"></i>';
      const meta = document.createElement('div'); meta.className='meta';
      const name = document.createElement('div'); name.className='name'; name.textContent=`${i+1}. ${s.title}`;
      const badge = document.createElement('div'); badge.className='badge'; badge.textContent=s.tag;
      meta.appendChild(name);
      a.appendChild(thumb); a.appendChild(meta); a.appendChild(badge);
      return a;
    }

    function render(list){ grid.innerHTML=''; list.forEach((s,i)=>grid.appendChild(createCard(s,i))); }
    render(songs);

    const input=document.getElementById('searchInput');
    const chips=Array.from(document.querySelectorAll('.chip'));
    function applyFilter(){
      const q=(input.value||'').trim().toLowerCase();
      const active=document.querySelector('.chip.active')?.dataset.filter||'all';
      const filtered=songs.filter(s=>{
        const matchQ=q===''||(s.title+' '+s.tag).toLowerCase().includes(q);
        const matchChip=active==='all'||s.tag.toLowerCase()===active.toLowerCase();
        return matchQ&&matchChip;
      });
      render(filtered);
    }
    input.addEventListener('input',applyFilter);
    chips.forEach(c=>c.addEventListener('click',()=>{chips.forEach(x=>x.classList.remove('active'));c.classList.add('active');applyFilter();}));
    document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==input){e.preventDefault();input.focus();}});
  </script>
</body>
</html>
